<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cart Blanche</title>
<meta name="theme-color" content="#1c0f27">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cart Blanche">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Mono:wght@400;500&family=Shrikhand&display=swap">
<style>
/* Layout: single phone column, three tabs (Cart / Drinks / List) on a fixed bottom bar, everything else in bottom sheets.
   Look: a late-night aubergine bar, sticker-bright category colors, a fat retro script for the name and headings. Single dark theme by choice. */
:root{
  color-scheme: dark;
  --night:#1c0f27; --plum:#2a1738; --plum2:#3a2150; --line:#4d3266;
  --cream:#fdf0e1; --muted:#bea8cf; --dim:#8c7699;
  --coral:#ff5f7e; --yolk:#ffd447; --mint:#45e3b5; --tang:#ff9b45; --lilac:#b994ff;
  --display:'Shrikhand', 'Cooper Black', Georgia, serif;
  --body:'Bricolage Grotesque', ui-rounded, system-ui, sans-serif;
  --mono:'DM Mono', ui-monospace, Menlo, monospace;
  --r:16px;
}
*{box-sizing:border-box}
html,body{background:var(--night);color:var(--cream)}
body{font-family:var(--body);font-size:16px;line-height:1.4;min-height:100%;
  background:
    radial-gradient(60% 40% at 100% 0%, rgba(255,95,126,.18), transparent 70%),
    radial-gradient(50% 35% at 0% 30%, rgba(185,148,255,.14), transparent 70%),
    var(--night);
  background-attachment:fixed;}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--yolk);outline-offset:2px;border-radius:8px}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px calc(110px + env(safe-area-inset-bottom,0px))}

/* header */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-block:6px 4px}
.brand{font-family:var(--display);font-size:2.1rem;line-height:1;letter-spacing:.5px;margin:0;color:var(--cream);
  text-shadow:3px 3px 0 var(--coral), 6px 6px 0 rgba(185,148,255,.55)}
.quip{color:var(--muted);font-size:.92rem;margin:.55rem 0 0;max-width:34ch}
.iconbtn{border:2px solid var(--line);background:var(--plum);border-radius:14px;width:44px;height:44px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px}
.syncnote{font-family:var(--mono);font-size:.72rem;color:var(--dim);margin-top:.35rem}

/* tabs */
.tab{display:none}
.tab.on{display:block}
.h2{font-family:var(--display);font-size:1.45rem;font-weight:400;margin:1.4rem 0 .6rem;text-wrap:balance;display:flex;align-items:baseline;gap:.5rem}
.h2 small{font-family:var(--mono);font-size:.75rem;color:var(--dim)}
.sub{color:var(--muted);font-size:.9rem;margin:-.3rem 0 .8rem}

/* stat stickers */
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.stat{border:none;border-radius:999px;padding:7px 13px;font-weight:700;font-size:.9rem;color:var(--night);display:inline-flex;gap:6px;align-items:baseline;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.stat b{font-family:var(--mono);font-weight:500}
.stat.a{background:var(--yolk);transform:rotate(-2deg)}
.stat.b{background:var(--mint);transform:rotate(1.5deg)}
.stat.c{background:var(--coral);transform:rotate(-1deg)}
.stat.c.off{background:var(--plum2);color:var(--muted);box-shadow:none}

/* search + chips */
.search{width:100%;background:var(--plum);border:2px solid var(--line);border-radius:14px;padding:11px 14px;font-size:1rem}
.search::placeholder{color:var(--dim)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:.88rem;font-weight:600;color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--cream);color:var(--night);border-color:var(--cream)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--plum);border:2px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-top:12px}
.seg button{border:none;background:transparent;border-radius:10px;padding:9px 4px;font-weight:700;font-size:.92rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--yolk);color:var(--night)}
.seg button b{font-family:var(--mono);font-weight:500;opacity:.75}

/* bottle rows */
.blist{display:flex;flex-direction:column;gap:8px}
.brow{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--plum);border-radius:var(--r);padding:10px 12px 10px 8px}
.brow.dead{opacity:.55}
.bglyph{border:none;background:none;padding:0;width:52px;height:68px;display:grid;place-items:center}
.bglyph svg{width:34px;height:68px;overflow:visible}
.bglyph.wob svg{animation:wob .5s ease}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}60%{transform:rotate(6deg)}}
.thumb{width:48px;height:64px;border-radius:10px;object-fit:cover;border:2px solid var(--line)}
.ph{position:relative;display:block}
.ph i{position:absolute;left:4px;right:4px;bottom:4px;height:5px;border-radius:3px;background:rgba(28,15,39,.75);overflow:hidden}
.ph i span{display:block;height:100%;background:var(--c,var(--tang))}
.bmid{min-width:0}
.bname{border:none;background:none;padding:0;text-align:left;font-weight:700;font-size:1.02rem;display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bsub{font-size:.8rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:1px}
.badge{font-family:var(--mono);font-size:.68rem;padding:2px 7px;border-radius:999px;background:var(--plum2);color:var(--muted)}
.badge.warn{background:var(--yolk);color:var(--night)}
.badge.hot{background:var(--coral);color:var(--night)}
.pips{display:flex;gap:5px;margin-top:8px}
.pip{width:30px;height:14px;border-radius:5px;border:2px solid var(--line);background:transparent;padding:0}
.pip.f{background:var(--c,var(--tang));border-color:var(--c,var(--tang))}
.lvl{font-family:var(--mono);font-size:.74rem;color:var(--muted);text-align:right;width:62px;line-height:1.2}
.lvl.low{color:var(--coral)}

/* pantry */
.pgroup{margin-bottom:12px}
.plabel{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:0 0 6px}
.pchips{display:flex;flex-wrap:wrap;gap:7px}
.pchip{border:2px dashed var(--line);background:transparent;color:var(--dim);border-radius:12px;padding:6px 11px;font-size:.88rem;font-weight:600}
.pchip.have{border-style:solid;border-color:var(--mint);background:rgba(69,227,181,.14);color:var(--cream)}
.pchip.have::before{content:"✓ ";color:var(--mint)}

/* empty state */
.empty{background:var(--plum);border:2px dashed var(--line);border-radius:22px;padding:22px 18px;margin-top:16px;text-align:left}
.empty h3{font-family:var(--display);font-weight:400;font-size:1.5rem;margin:0 0 .4rem;line-height:1.15}
.empty p{color:var(--muted);margin:0 0 14px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:none;border-radius:14px;padding:12px 16px;font-weight:800;font-size:.98rem;background:var(--yolk);color:var(--night);box-shadow:0 4px 0 rgba(0,0,0,.35);display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn.mint{background:var(--mint)}
.btn.coral{background:var(--coral)}
.btn.ghost{background:transparent;color:var(--cream);border:2px solid var(--line);box-shadow:none}
.btn.small{padding:8px 12px;font-size:.88rem;border-radius:11px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5}
.linkish{border:none;background:none;color:var(--yolk);font-weight:700;padding:0;text-decoration:underline;text-underline-offset:3px}

/* drink cards */
.dlist{display:flex;flex-direction:column;gap:8px}
.dcard{width:100%;text-align:left;border:none;background:var(--plum);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.dtop{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.dname{font-weight:800;font-size:1.06rem}
.dname .star{color:var(--yolk)}
.pill{font-family:var(--mono);font-size:.7rem;padding:3px 8px;border-radius:999px;white-space:nowrap;flex:none}
.pill.ready{background:var(--mint);color:var(--night)}
.pill.one{background:var(--yolk);color:var(--night)}
.pill.far{background:var(--plum2);color:var(--muted)}
.dings{font-size:.84rem;color:var(--muted);line-height:1.5}
.dings .miss{color:var(--coral);text-decoration:line-through;text-decoration-thickness:2px}
.dings .opt{opacity:.6}
.choice{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(120deg,var(--coral),var(--tang));color:var(--night);border-radius:20px;padding:14px 16px;margin-top:14px;border:none;width:100%;text-align:left;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.choice b{font-family:var(--display);font-weight:400;font-size:1.3rem;display:block}
.choice span{font-size:.86rem;font-weight:600}
.choice svg{width:40px;height:40px;flex:none}

/* unlock panel */
.unlock{background:var(--plum);border-radius:20px;padding:14px;border:2px solid var(--line)}
.urow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.urow:first-of-type{border-top:none}
.unum{font-family:var(--mono);font-size:1.3rem;color:var(--yolk);text-align:center;font-variant-numeric:tabular-nums}
.unum small{display:block;font-size:.6rem;color:var(--dim)}
.uname{font-weight:700}
.uwhat{font-size:.8rem;color:var(--muted)}

/* shopping */
.slist{display:flex;flex-direction:column;gap:6px}
.srow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--plum);border-radius:14px;padding:10px 12px}
.srow.done .sname{text-decoration:line-through;color:var(--dim)}
.check{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);background:transparent;display:grid;place-items:center;padding:0}
.check.on{background:var(--mint);border-color:var(--mint);color:var(--night)}
.check svg{width:16px;height:16px}
.sname{font-weight:700}
.swhy{font-size:.78rem;color:var(--muted)}
.x{border:none;background:none;color:var(--dim);font-size:1.3rem;width:36px;height:36px;border-radius:10px}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow .search{flex:1;min-width:0}
.stockbar{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));margin-top:14px;z-index:5}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(28,15,39,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:2px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
.navin{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr 72px;gap:6px;align-items:center}
.nav button.t{border:none;background:none;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;font-weight:700;padding:6px 0;border-radius:12px;position:relative}
.nav button.t svg{width:24px;height:24px}
.nav button.t[aria-current="page"]{color:var(--cream)}
.nav button.t[aria-current="page"] svg{color:var(--yolk)}
.nav .dot{position:absolute;top:2px;right:calc(50% - 22px);background:var(--coral);color:var(--night);font-family:var(--mono);font-size:.62rem;border-radius:999px;padding:1px 5px}
.fab{width:62px;height:62px;border-radius:20px;border:none;background:var(--coral);color:var(--night);display:grid;place-items:center;transform:translateY(-14px) rotate(-6deg);box-shadow:0 5px 0 rgba(0,0,0,.4);justify-self:end}
.fab svg{width:30px;height:30px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,4,16,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:90dvh;overflow:auto;background:var(--plum);border-radius:26px 26px 0 0;border:2px solid var(--line);border-bottom:none;padding:10px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.stitle{font-family:var(--display);font-weight:400;font-size:1.8rem;line-height:1.1;margin:0;text-wrap:balance}
.smeta{color:var(--muted);font-size:.86rem;margin:.35rem 0 0}
.close{border:none;background:var(--plum2);border-radius:12px;width:40px;height:40px;font-size:1.3rem;flex:none}
.field{display:flex;flex-direction:column;gap:5px;margin-top:12px}
.field label,.flabel{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.inp{background:var(--night);border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:1rem;width:100%;min-width:0}
textarea.inp{min-height:64px;resize:vertical}
.lvlseg{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.lvlseg button{border:2px solid var(--line);background:var(--night);border-radius:11px;padding:8px 2px;font-size:.74rem;font-weight:700;color:var(--muted);line-height:1.15}
.lvlseg button[aria-pressed="true"]{background:var(--c,var(--tang));border-color:var(--c,var(--tang));color:var(--night)}
.hero{display:flex;gap:14px;align-items:center;margin-top:10px}
.hero .bigph{width:92px;height:122px;border-radius:16px;object-fit:cover;border:2px solid var(--line)}
.hero svg{width:60px;height:120px;overflow:visible}

/* recipe sheet */
.status{border-radius:14px;padding:10px 12px;margin-top:12px;font-weight:700;font-size:.92rem}
.status.ready{background:rgba(69,227,181,.16);color:var(--mint)}
.status.miss{background:rgba(255,95,126,.14);color:var(--coral)}
.ings{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column}
.ings li{display:grid;grid-template-columns:22px 92px 1fr;gap:8px;align-items:baseline;padding:8px 0;border-bottom:1px dashed var(--line)}
.ings .amt{font-family:var(--mono);font-size:.92rem;color:var(--yolk);font-variant-numeric:tabular-nums}
.ings .mk{font-size:.9rem}
.ings .mk.y{color:var(--mint)}
.ings .mk.n{color:var(--coral)}
.ings .nm small{color:var(--dim);font-size:.78rem}
.ings li.n .nm{color:var(--coral)}
.how{margin:14px 0 0;line-height:1.55;max-width:60ch}
.note{margin:10px 0 0;color:var(--muted);font-style:italic}
.minirow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.stepper{display:flex;gap:4px;background:var(--night);border-radius:12px;padding:3px;border:2px solid var(--line)}
.stepper button{border:none;background:transparent;border-radius:9px;padding:6px 10px;font-family:var(--mono);font-size:.82rem;color:var(--muted)}
.stepper button[aria-pressed="true"]{background:var(--lilac);color:var(--night)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.used{margin-top:14px;background:var(--night);border-radius:14px;padding:12px}
.used .urow2{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0}
.used .pips{margin-top:0}

/* quick pick / photo results */
.qgrid{display:flex;flex-wrap:wrap;gap:7px}
.qchip{border:2px solid var(--line);background:transparent;border-radius:12px;padding:7px 11px;font-size:.88rem;font-weight:600;color:var(--muted)}
.qchip[aria-pressed="true"]{background:var(--c,var(--yolk));border-color:var(--c,var(--yolk));color:var(--night)}
.qchip.got{opacity:.45}
.addopts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.addopt{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--night);border-radius:18px;padding:14px}
.addopt .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:var(--night)}
.addopt .ic svg{width:26px;height:26px}
.addopt b{display:block;font-size:1.05rem}
.addopt span{font-size:.84rem;color:var(--muted)}
.found{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.frow{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:var(--night);border-radius:14px;padding:10px}
.frow .inp{padding:8px 10px;font-size:.95rem}
.frow .two{display:flex;flex-direction:column;gap:6px;min-width:0}
.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--yolk);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.ingrow{display:grid;grid-template-columns:1fr 64px 76px 32px;gap:6px;margin-top:6px}
.ingrow .inp{padding:8px;font-size:.9rem}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--cream);color:var(--night);border-radius:14px;padding:10px 12px 10px 14px;display:flex;gap:12px;align-items:center;font-weight:700;font-size:.92rem;box-shadow:0 6px 0 rgba(0,0,0,.35);width:max-content;max-width:calc(100% - 32px)}
.toast button{border:none;background:var(--night);color:var(--yolk);border-radius:10px;padding:7px 10px;font-weight:800;font-size:.84rem;flex:none}

@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}

/* in/out toggle */
.tog{flex:none;border:2px solid var(--mint);background:rgba(69,227,181,.16);color:var(--mint);border-radius:999px;padding:7px 12px;font-weight:800;font-size:.8rem;min-width:76px}
.tog.out{border-color:var(--coral);background:transparent;color:var(--coral);border-style:dashed}
.lvlseg.two{grid-template-columns:1fr 1fr}
.lvlseg.two button{font-size:.9rem;padding:10px 4px}
.src{color:var(--dim);font-family:var(--mono);font-size:.74rem}
a.src{color:var(--lilac);text-decoration:none;border-bottom:1px dashed var(--lilac)}
/* standalone app shell */
.sheet-open .toast{bottom:auto;top:calc(12px + env(safe-area-inset-top,0px))}
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
button{touch-action:manipulation}
.app{padding-top:calc(14px + env(safe-area-inset-top,0px))}
.inp,.search{font-size:16px}
.sheet{max-height:calc(100dvh - env(safe-area-inset-top,0px) - 12px)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1 class="brand">Cart Blanche</h1>
      <p class="quip" id="quip"></p>
      <div class="syncnote" id="syncnote">Unlocking the cabinet…</div>
    </div>
    <button class="iconbtn" data-act="settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
    </button>
  </header>

  <!-- CART -->
  <section class="tab" id="tab-cart">
    <div class="stats" id="cartStats"></div>
    <div id="cartEmpty"></div>
    <div id="cartTools" style="margin-top:14px">
      <input class="search" id="cartSearch" type="search" placeholder="Find a bottle…" autocomplete="off">
      <div class="chips" id="cartChips"></div>
    </div>
    <div id="cartList"></div>
    <h2 class="h2">Fridge &amp; pantry</h2>
    <p class="sub">The stuff that's either there or it isn't. Tap to toggle.</p>
    <div id="pantry"></div>
  </section>

  <!-- DRINKS -->
  <section class="tab" id="tab-drinks">
    <button class="choice" data-act="surprise">
      <div><b>Bartender's choice</b><span id="choiceSub">Can't decide? Let the cart decide.</span></div>
      <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><rect x="5" y="5" width="30" height="30" rx="7"/><circle cx="13" cy="13" r="2.2" fill="currentColor"/><circle cx="27" cy="27" r="2.2" fill="currentColor"/><circle cx="20" cy="20" r="2.2" fill="currentColor"/><circle cx="27" cy="13" r="2.2" fill="currentColor"/><circle cx="13" cy="27" r="2.2" fill="currentColor"/></svg>
    </button>
    <div class="seg" id="drinkSeg"></div>
    <div style="margin-top:12px"><input class="search" id="drinkSearch" type="search" placeholder="Search drinks or ingredients…" autocomplete="off"></div>
    <div class="chips" id="drinkChips"></div>
    <div id="drinkUnlock"></div>
    <div id="drinkList" style="margin-top:8px"></div>
    <div style="margin-top:18px"><button class="btn ghost wide" data-act="new-recipe">+ Add your own recipe</button></div>
  </section>

  <!-- LIST -->
  <section class="tab" id="tab-list">
    <h2 class="h2" style="margin-top:.6rem">Shopping list <small id="listCount"></small></h2>
    <div class="addrow">
      <input class="search" id="listAdd" type="text" placeholder="Add anything… (Campari, limes)" autocomplete="off" enterkeyhint="done">
      <button class="btn small" data-act="list-add">Add</button>
    </div>
    <div id="listItems"></div>
    <div id="listStock"></div>
    <div id="listLow"></div>
    <div id="listUnlock"></div>
  </section>
</div>

<nav class="nav" aria-label="Sections">
  <div class="navin">
    <button class="t" data-act="tab" data-tab="cart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M10 2h4v4c3 1 4 3 4 6v9a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-9c0-3 1-5 4-6z"/><path d="M6 13h12"/></svg>Cart
    </button>
    <button class="t" data-act="tab" data-tab="drinks">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M3 4h18l-9 9z"/><path d="M12 13v8M8 21h8"/><path d="M15 2l-2 5"/></svg>Drinks
    </button>
    <button class="t" data-act="tab" data-tab="list">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01" stroke-width="3"/></svg>List<span class="dot" id="listDot" hidden></span>
    </button>
    <button class="fab" data-act="add" aria-label="Add to the cart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>
</nav>

<div id="sheetRoot"></div>
<div id="toastRoot"></div>
<input type="file" id="photoIn" accept="image/*" hidden>
<script src="firebase-config.js"></script>
<script src="recipes.js"></script>
<script src="app.js"></script>
</body>
</html>
